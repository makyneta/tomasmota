<body>
  <div id="bar" aria-hidden="true"></div>
  <div id="header"></div>

  <main class="feedback-page">
    <section class="feedback-hero" aria-labelledby="feedback-title">
      <div>
        <p class="feedback-eyebrow">Makyneta // Client experiences</p>
        <h1 class="feedback-title" id="feedback-title">TRUST, BUILT<br><span>TOGETHER.</span></h1>
        <!-- <p class="feedback-intro">The best measure of our work is how it helps the people behind each project. Here are a few words from clients we have worked with.</p> -->
      </div>
      <aside class="feedback-summary" aria-label="Client feedback summary">
        <div class="feedback-summary-top">
          <strong class="feedback-average" id="feedback-average">—</strong>
          <span class="feedback-out-of">/ 5</span>
        </div>
        <div class="feedback-summary-stars" aria-hidden="true">★★★★★</div>
        <p class="feedback-summary-copy" id="feedback-summary-copy">Client testimonials</p>
      </aside>
    </section>

    <section class="feedback-listing" aria-labelledby="feedback-list-title">
      <div class="feedback-listing-heading">
        <h2 id="feedback-list-title">A WORD FROM CLIENTS</h2>
        <span class="feedback-count" id="feedback-count">Client testimonials</span>
      </div>
      <div class="feedback-grid" id="feedback-grid" aria-live="polite" aria-busy="true">
        <p class="feedback-empty">Loading client feedback…</p>
      </div>
    </section>

    <!-- <section class="feedback-cta" aria-labelledby="feedback-cta-title">
