<header id="main-header">
  <a href="/" class="header-logo">
    <img src="/assets/images/ui/header.webp" alt="Makyneta" class="header-logo-img">
  </a>

  <nav class="header-nav">
    <a href="/#about" class="nav-link">Sobre</a>

    <div class="dropdown-wrapper">
      <button class="nav-btn">
        Portefólio
        <i class="fa-solid fa-chevron-down" style="font-size:.4rem;opacity:.5"></i>
      </button>
      <div class="dropdown-menu">
        <a href="/web-development"><i class="fa-solid fa-code"></i> Desenvolvimento Web</a>
        <a href="/photography"><i class="fa-solid fa-camera"></i> Fotografia</a>
      </div>
    </div>

    <a href="/#home-contact" class="nav-link">Contacto</a>
  </nav>

  <button id="mobile-menu-toggle-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobile-menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <script>
    (function(){
      var path = window.location.pathname;
      document.querySelectorAll('#main-header .nav-link').forEach(function(el){
        if (el.getAttribute('href') === path) el.classList.add('active');
      });
      var btns = document.querySelectorAll('#main-header .nav-btn');
      if (path.match(/^\/(develop|photo|video|interviews|feedback)/)) {
        if (btns[0]) btns[0].classList.add('active');
      }
      document.querySelectorAll('#mobile-menu .mm-link').forEach(function(el){
        if (el.getAttribute('href') === path) el.classList.add('active');
      });
    })();
  </script>
</header>
