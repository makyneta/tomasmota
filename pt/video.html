<body>
  <div id="bar"></div>
  <div id="header"></div>

  <main>
    <section id="page-hero">
      <div class="hero-ghost">VÍDEO</div>
      <div class="eyebrow"><span>Portfólio — Vídeo</span></div>
      <h1 class="hero-title">VÍDEO<span class="outline"></span></h1>
      <div class="hero-foot">
        <p class="hero-lead">
          Movimento, edição e conteúdo curto — desde cobertura de eventos
          até narrativas visuais.
        </p>
      </div>
    </section>

    <section id="video-section" class="reveal">
      <div class="video-grid" id="video-grid"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script>
    const VIDEOS = [
  {
    title: 'Apresentação da Candidatura de Ricardo Lopes',
    desc: 'Vídeo de apresentação da candidatura de Ricardo Lopes à Comissão Política do PS da Marinha Grande.',
    client: 'PS Marinha Grande',
    embed: 'https://www.youtube.com/embed/Igmi2JkPEwk',
    thumbnail: '/assets/images/projects/video/psmg-apricardolopes.webp',
    link: 'https://youtu.be/Igmi2JkPEwk'
  },

  {
    title: 'Neuton Marques @ Todos pela Marinha',
    desc: 'Vídeo da atuação ao vivo de Neuton Marques no evento "Todos pela Marinha".',
    client: 'CM Marinha Grande & Neuton Marques',
    embed: 'https://www.youtube.com/embed/CCtTfm1G7jc',
    thumbnail: '/assets/images/projects/video/cmmg-neutonmarques.webp',
    link: 'https://youtu.be/CCtTfm1G7jc'
  },

  {
    title: 'A Inteligência Artificial no Ensino',
    desc: 'Reportagem sobre a Inteligência Artificial no Ensino, realizada como Projeto de Aptidão Profissional, para a conclusão do 12º ano.',
    client: 'AE Marinha Grande Poente',
    embed: 'https://www.youtube.com/embed/pQgIhACiPts',
    thumbnail: '/assets/images/projects/video/aemgp-iaensino.webp',
    link: 'https://youtu.be/pQgIhACiPts'
  },
];

    function renderVideos() {
      const grid = document.getElementById('video-grid');
      if (!grid) return;

      if (!VIDEOS.length) return;

      grid.innerHTML = VIDEOS.map(v => `
        <a class="v-card" href="${v.link}" target="_blank" rel="noopener">
          <div class="v-thumb-wrap">
            <img class="v-thumb" src="${v.thumbnail}" alt="${v.title}" loading="lazy">
            <div class="v-play">
              <div class="v-play-btn"></div>
            </div>
          </div>
          <div class="v-body">
            ${v.client ? `<div class="v-client">${v.client}</div>` : ''}
            <div class="v-title">${v.title}</div>
            ${v.desc ? `<div class="v-desc">${v.desc}</div>` : ''}
            <span class="v-link">Ver projeto →</span>
          </div>
        </a>
      `).join('');
    }

    renderVideos();
  </script>
